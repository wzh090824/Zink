<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>创建短链</title>
    <link rel="stylesheet" href="/Assets/Styles.css" />
    <script src="/Assets/App.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="page-tools">
        <div class="service-state" aria-live="polite">
          <span class="state-dot" id="state-dot"></span>
          <span id="service-status">正在检查服务</span>
        </div>
        <div class="access-controls">
          <span class="access-badge" id="access-badge">选择访问模式</span>
          <button class="change-mode-button" id="change-mode" type="button">
            访问设置
          </button>
        </div>
        <div class="theme-switch" role="group" aria-label="主题">
          <button type="button" data-theme-choice="light" aria-pressed="false">
            浅色
          </button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">
            深色
          </button>
        </div>
      </header>

      <main class="main-content">
        <section class="form-card" aria-labelledby="page-title">
          <h1 id="page-title">创建短链</h1>
          <form id="create-form" novalidate>
            <div class="field-group" id="custom-code-field">
              <label for="short-code">自定义短码</label>
              <div class="input-with-prefix">
                <span class="domain-prefix" id="origin-prefix"
                  >your-domain/</span
                >
                <input
                  id="short-code"
                  name="code"
                  type="text"
                  placeholder="例如：我的链接 / my-link"
                  autocomplete="off"
                  aria-describedby="code-hint"
                />
              </div>
              <p class="field-hint" id="code-hint">
                管理员可自定义任意字符和中文，最多 64 个字符；访客使用随机短码。
              </p>
            </div>

            <div class="guest-code-note" id="guest-code-note" hidden>
              访客模式：短码由系统随机生成，无法自定义。
            </div>

            <div class="field-group">
              <label for="target-url"
                >目标 URL
                <span class="field-detail">（最多 300 字符）</span></label
              >
              <input
                id="target-url"
                name="url"
                type="url"
                placeholder="https://example.com"
                maxlength="300"
                autocomplete="url"
                required
              />
            </div>

            <div class="field-group">
              <label for="expires-at"
                >失效时间
                <span class="field-detail">（当地时间，可选）</span></label
              >
              <input id="expires-at" name="expiresAt" type="datetime-local" />
            </div>

            <div class="form-error" id="form-error" role="alert" hidden></div>
            <button class="submit-button" id="submit-button" type="submit">
              创建短链
            </button>
          </form>

          <section
            class="result-panel"
            id="result-panel"
            aria-live="polite"
            hidden
          >
            <p class="result-message" id="result-message">
              请求已提交，正在等待 GitHub Action。
            </p>
            <a
              class="result-link"
              id="result-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
            <button class="copy-button" id="copy-link" type="button">
              复制短链
            </button>
            <div class="action-status-row">
              <span class="action-status-dot" id="action-status-dot"></span
              ><span id="action-status">等待 Action 启动</span>
            </div>
            <p class="uploaded-at" id="uploaded-at" hidden></p>
            <a
              class="run-link"
              id="run-link"
              href="https://github.com"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              >查看本次 Action <span aria-hidden="true">↗</span></a
            >
          </section>

          <p class="form-note" id="form-note">
            创建请求将由 GitHub Action 写入仓库，通常几秒后即可访问。
          </p>
          <a
            class="action-link"
            id="action-link"
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            >查看构建状态 <span aria-hidden="true">↗</span></a
          >
        </section>
      </main>

      <footer class="page-footer">
        <span>无数据库 · Cloudflare + GitHub</span>
        <span>短码映射存储于仓库文件</span>
      </footer>
    </div>

    <dialog
      class="access-dialog"
      id="access-dialog"
      aria-labelledby="access-title"
    >
      <form id="access-form" novalidate>
        <p class="dialog-eyebrow">SHORT LINK ACCESS</p>
        <h2 id="access-title">选择访问模式</h2>
        <p class="dialog-description">
          输入管理员访问密码以自定义短码，或跳过并以访客模式创建随机短链。
        </p>
        <label for="access-password">管理员访问密码</label>
        <input
          id="access-password"
          type="password"
          placeholder="输入访问密码"
          autocomplete="current-password"
        />
        <div class="access-error" id="access-error" role="alert" hidden></div>
        <button
          class="admin-access-button"
          id="admin-access-button"
          type="submit"
        >
          管理员进入
        </button>
        <button
          class="guest-access-button"
          id="guest-access-button"
          type="button"
        >
          跳过，访客继续
        </button>
      </form>
    </dialog>
  </body>
</html>
