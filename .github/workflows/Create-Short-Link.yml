name: Create New
run-name: Short-${{ github.event.client_payload.code }}

on:
  repository_dispatch:
    types: [create_short_link]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and write short-link record
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload || {};
            const code = typeof payload.code === 'string' ? payload.code.normalize('NFC') : '';
            const codePoints = Array.from(code).length;
            const codeBytes = Buffer.byteLength(code, 'utf8');
            if (!code || codePoints > 64 || codeBytes > 180) {
              core.setFailed('Short code must contain 1-64 Unicode characters and at most 180 UTF-8 bytes.');
              return;
            }

            const target = typeof payload.url === 'string' ? payload.url : '';
            let parsed;
            try { parsed = new URL(target); } catch {}
            if (!parsed || !['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) {
              core.setFailed('Target URL must be HTTP(S) and contain no credentials.');
              return;
            }

            const expiresAt = typeof payload.expiresAt === 'string' ? payload.expiresAt : '';
            if (expiresAt) {
              const expiryTime = Date.parse(expiresAt);
              if (!Number.isFinite(expiryTime) || new Date(expiryTime).toISOString() !== expiresAt || expiryTime <= Date.now()) {
                core.setFailed('Expiration must be a valid future timestamp.');
                return;
              }
            }

            const safeFileName = code !== '.'
              && code !== '..'
              && !code.startsWith('~')
              && !/[<>:"/\\|?*\u0000-\u001f\u007f]/u.test(code)
              && !/[. ]$/u.test(code)
              && !/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?$/i.test(code);
            const fileName = safeFileName
              ? code
              : `~${Buffer.from(code, 'utf8').toString('base64url')}`;
            const { owner, repo } = context.repo;
            const branch = payload.branch || context.payload.repository.default_branch;
            const path = `List/${fileName}`;

            try {
              await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              core.setFailed('This short code already exists; no file was overwritten.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const record = {
              code,
              url: target,
              ip: typeof payload.ip === 'string' ? payload.ip.slice(0, 128) : '',
              uploadedAt: new Date().toISOString(),
              expiresAt: expiresAt || null,
            };
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              encoding: 'utf-8',
              content: JSON.stringify(record, null, 2),
            });

            for (let attempt = 0; attempt < 5; attempt += 1) {
              if (attempt > 0) {
                try {
                  await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                  core.setFailed('This short code already exists; no file was overwritten.');
                  return;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const head = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: head.data.object.sha });
              const tree = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: parent.data.tree.sha,
                tree: [{ path, mode: '100644', type: 'blob', sha: blob.data.sha }],
              });
              const commit = await github.rest.git.createCommit({
                owner,
                repo,
                message: 'Add short link mapping',
                tree: tree.data.sha,
                parents: [head.data.object.sha],
              });

              try {
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
                core.notice(`Created List/${fileName}`);
                return;
              } catch (error) {
                if (error.status !== 422 || attempt === 4) throw error;
              }
            }
